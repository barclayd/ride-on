name: extension

on:
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

# PRs: newest push wins. main: queue, so each release sees the previous run's tag.
concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history for the version bump
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('extension/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      # ponytail: browsers aren't cached; Playwright says a restore is about as slow as the download.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

      # Next version = last extension-v* tag + 1 patch, or package.json's if that's higher
      # (bump it there for minor/major). Tests, docs and store images alone don't count as a change.
      - id: version
        run: |
          src=(. ':!e2e' ':!unit' ':!store' ':!*.md' ':!playwright.config.ts')
          last=$(git tag -l 'extension-v*' --sort=-v:refname | head -1)
          pkg=$(jq -r .version package.json)
          if [ -z "$last" ]; then
            next=$pkg changed=true
          else
            prev=${last#extension-v}
            next=$(printf '%s\n' "$pkg" "${prev%.*}.$((${prev##*.} + 1))" | sort -V | tail -1)
            git diff --quiet "$last" HEAD -- "${src[@]}" && changed=false || changed=true
          fi
          mkdir -p .output
          # GitHub's "Source code" archive is named ride-on-extension-v<version>.zip; point at the right one.
          { echo "Chrome Web Store upload: \`ride-on-extension-$next-chrome.zip\` (not the Source code archives)."
            echo "Install unpacked: unzip \`ride-on-extension-$next-chrome-unpacked.zip\` and load the folder at chrome://extensions (the store zip can't sign in that way)."
            echo "Safari (TestFlight / App Store): run \`extension/safari/archive.sh\` on this tag."
            echo
            git log --no-merges --format='- %s' ${last:+"$last.."}HEAD -- "${src[@]}"; } > .output/notes.md
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Extension $next (changed since ${last:-no tag}: $changed)" >> "$GITHUB_STEP_SUMMARY"

      # Unpacked build: keeps the manifest `key`, so a sideloaded install gets the fixed ID whose
      # sign-in redirect the API accepts. Without it Chrome derives the ID from the folder path.
      - run: bun run zip && mv .output/*-chrome.zip ".output/ride-on-extension-$EXTENSION_VERSION-chrome-unpacked.zip"
        env:
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
      # Store build: production API, computed version, no manifest `key` (the Web Store rejects it).
      - run: bun run zip
        env:
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
          STORE_BUILD: "1"
      - run: |
          unzip -p .output/*-chrome.zip manifest.json \
          | jq -e --arg v "$EXTENSION_VERSION" '.version == $v and (has("key") | not)'
          unzip -p .output/*-chrome-unpacked.zip manifest.json \
          | jq -e --arg v "$EXTENSION_VERSION" '.version == $v and has("key")'
        env:
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: |
            extension/.output/*-chrome.zip
            extension/.output/*-chrome-unpacked.zip
            extension/.output/notes.md
          include-hidden-files: true # .output
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: extension-e2e
          path: extension/test-results
          if-no-files-found: ignore

  # Safari: the same WXT source built into its Xcode container, unsigned (archive.sh signs and uploads).
  safari:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: brew install xcodegen
      - run: xcodegen generate --spec safari/project.yml
      - run: |
          for destination in 'platform=macOS' 'generic/platform=iOS Simulator'; do
            xcodebuild -project safari/RideOn.xcodeproj -scheme RideOn \
              -destination "$destination" CODE_SIGNING_ALLOWED=NO build
          done

  release:
    needs: [build, safari]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-zip
      - run: >
          gh release create "extension-v$VERSION" ./*-chrome.zip ./*-chrome-unpacked.zip
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Extension $VERSION" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
