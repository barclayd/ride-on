name: landing

on:
  pull_request:
    paths:
      - "landing/**"
      - "app/Packages/Features/Sources/SharedUI/CycleMap/**" # copied in by scripts/copy-map.ts
      - ".github/workflows/landing.yml"
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "app/Packages/Features/Sources/SharedUI/CycleMap/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

# PRs: newest push wins. main: queue, so deploys land in order.
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('landing/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: landing-e2e
          path: landing/test-results
          if-no-files-found: ignore

      # main only: ship the build that was just tested.
      - if: github.ref == 'refs/heads/main'
        run: bunx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # A new version can take a few seconds to reach the edge serving this runner.
      - if: github.ref == 'refs/heads/main'
        name: Verify deployed site
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://ride-on.cc | grep -q "<meta name=\"revision\" content=\"$GITHUB_SHA\""; then
              location=$(curl -fsS -o /dev/null -w '%{redirect_url}' https://www.ride-on.cc/)
              [ "$location" = "https://ride-on.cc/" ] && exit 0
              echo "www redirected to '$location'"
            fi
            [ "$attempt" -lt 6 ] && sleep 10
          done
          exit 1
