name: worker-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Manual retries must also deploy main, never an unmerged feature branch.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: bunx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Verify the exact deployed commit without spending weather quota. A new
      # version can take a few seconds to reach the edge serving this runner.
      - name: Verify deployed API
        run: |
          for attempt in 1 2 3 4 5 6; do
            if bun test test/smoke.test.ts; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          exit 1
        env:
          WORKER_URL: https://api.ride-on.cc
          EXPECTED_REVISION: ${{ github.sha }}
