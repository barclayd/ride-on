name: maps-style

on:
  pull_request:
    paths:
      - "maps/style/**"
      - "app/Packages/Features/Sources/SharedUI/CycleMap/**"
      - ".github/workflows/maps-style.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps/style
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
